      font-size: 20px;
      font-weight: 600;
      margin: 5px 0;
    }

      position: absolute;
      top: 10px;
      right: 10px;
      cursor: pointer;
      background: rgba(255,255,255,0.2);
      padding: 3px 7px;
      border-radius: 5px;
      transition: .3s;
    }
    .delete:hover { background: rgba(255,255,255,0.35);}

      height: 10px;
      background: rgba(255,255,255,0.25);
      border-radius: 5px;
      margin-top: 8px;

<body>

  <div class="container">
    <h1>Manage Categories ✨</h1>

    <div class="inputBox">
      <input type="text" id="categoryName" placeholder="Add new category...">
      <button onclick="addCategory()">Add</button>
      <input type="text" id="search" placeholder="Search..." onkeyup="renderCategories()">
    </div>

    <div id="categoryList"></div>
  </div>

  <script>
    const icons=["🍔","🎒","🚗","🎁","💼","🏠","🛍","💡","📚","✨","📱","🎮","☕"];
    const colors=["#ff6b6b","#4dabf7","#ffd43b","#69db7c","#845ef7","#ffa94d","#f06595"];
    function getRandom(arr){return arr[Math.floor(Math.random()*arr.length)];}
    let categories=JSON.parse(localStorage.getItem("categories"))||[];

    function addCategory(){
      const name=document.getElementById("categoryName").value.trim();
      if(!name)return alert("Please enter category name!");
      categories.push({name,icon:getRandom(icons),color:getRandom(colors),spent:0});
      localStorage.setItem("categories",JSON.stringify(categories));
      document.getElementById("categoryName").value="";
      renderCategories();
    }

    function deleteCat(i){
      if(confirm("Delete this category?")){
        categories.splice(i,1);
        localStorage.setItem("categories",JSON.stringify(categories));
        renderCategories();
      }
    }

    function renderCategories(){
      const listBox=document.getElementById("categoryList");
      const search=document.getElementById("search").value.toLowerCase();
      let html="";
      const filtered=categories.filter(c=>c.name.toLowerCase().includes(search));
      if(!filtered.length){listBox.innerHTML=`<p style="color:white;opacity:.7;">No categories match ✨</p>`;return;}
      filtered.forEach((cat,i)=>{
        const percent=Math.min(cat.spent*2,100);
        html+=`
        <div class='card' style='border-left:8px solid ${cat.color};'>
          <span class='delete' onclick='deleteCat(${i})'>✖</span>
          <div class='icon'>${cat.icon}</div>
          <div class='title'>${cat.name}</div>
          <p>Spent: ₹${cat.spent}</p>
          <div class='bar'><div class='fill' style='width:${percent}%;background:${cat.color};'></div></div>
        </div>`;
      });
      listBox.innerHTML=html;
    }

    renderCategories();
  </script>

</body>
</html>-->

 <input id="search" placeholder="Search category..." onkeyup="renderCategories()">

<script>
// --- Auto Icon Selector ---
function getIconByName(name){
  const t=name.toLowerCase();
  if(t.includes("food")||t.includes("eat")||t.includes("meal"))return "🍔";
  if(t.includes("travel")||t.includes("fuel")||t.includes("bus"))return "🚗";
  if(t.includes("shop")||t.includes("cloth")||t.includes("mall"))return "🛍️";
  if(t.includes("bill")||t.includes("electric")||t.includes("gas"))return "💡";
  if(t.includes("study")||t.includes("book"))return "📚";
  if(t.includes("home")||t.includes("rent"))return "🏠";
  if(t.includes("gift"))return "🎁";
  if(t.includes("med")||t.includes("health"))return "💊";
  if(t.includes("phone")||t.includes("recharge"))return "📱";
  return "✨";
}

let categories = JSON.parse(localStorage.getItem("categories"))||[];

function addCategory(){
  const name=document.getElementById("categoryName").value.trim();
  if(!name)return alert("Please enter category name");
  const icon=getIconByName(name);
  categories.push({name,icon,spent:0});
  localStorage.setItem("categories",JSON.stringify(categories));
  document.getElementById("categoryName").value="";
  renderCategories();
}

function renderCategories(){
  const value=document.getElementById("search").value.toLowerCase();
  let list="";
  categories
    .filter(c=>c.name.toLowerCase().includes(value))
    .forEach((cat,i)=>{
      const percent=Math.min(cat.spent*2,100);
      list+=`<div class='card'>
          <span class='delete' onclick='deleteCat(${i})'>✖</span>
          <div class='icon'>${cat.icon}</div>
          <div class='title'>${cat.name}</div>
          <p style='text-align:center;'>Spent: ₹${cat.spent}</p>
          <div class='bar'><div class='fill' style='width:${percent}%;'></div></div>
        </div>`;
    });
  document.getElementById("categoryList").innerHTML=list||`<p class='no-data'>No categories added yet ✨</p>`;
}

function deleteCat(i){
  if(confirm("Delete category?")){
    categories.splice(i,1);
    localStorage.setItem("categories",JSON.stringify(categories));
    renderCategories();
  }
}
renderCategories();
</script>
</body>
</html>-->

<body>

<nav class="navbar">
    <h2 class="logo">Smart Expense Tracker</h2>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="analytics.html">Analytics</a></li>
        <li><a class="active" href="#">Budget</a></li>
        <li><a href="about.html">About</a></li>
    </ul>
</nav>

<div class="container">
    <h2>Monthly Budget + Smart Advisor 🤖</h2>

    <input type="number" id="budgetInput" placeholder="Enter monthly budget ₹">
    <button onclick="setBudget()">Set / Update Budget</button>

    <h3>💰 Budget: ₹<span id="budget">0</span></h3>
    <h3>🧾 Total Expenses: ₹<span id="total">0</span></h3>
    <h3>💸 Remaining: ₹<span id="remain">0</span></h3>

    <div class="suggestion-title">Smart Spending Suggestions 👇</div>
    <div id="adviceArea"></div>
</div>

<script>
// --- DATA LOAD ---
let budget = localStorage.getItem("budget") ? Number(localStorage.getItem("budget")) : 0;
let expenses = localStorage.getItem("expenses") ? JSON.parse(localStorage.getItem("expenses")) : [];

document.getElementById("budget").innerText = budget;

// --- UPDATE BUDGET ---
function setBudget(){
    let val = document.getElementById("budgetInput").value;
    if(!val || val<=0) return alert("Enter valid budget!");
    budget = Number(val);
    localStorage.setItem("budget", budget);
    showData();
}

// --- SHOW SUMMARY + ADVICE ---
function showData(){
    let total = expenses.reduce((s,e)=>s+e.amount,0);
    document.getElementById("budget").innerText = budget;
    document.getElementById("total").innerText = total;
    document.getElementById("remain").innerText = budget-total;

    giveAdvice(total);
}

// --- UNIQUE SUGGESTION LOGIC ----

    let area = document.getElementById("adviceArea");
    area.innerHTML = "";

    if(expenses.length === 0){
        area.innerHTML = adviceBox("Start adding expenses to receive smart advice 😊");
        return;

    if(total > budget){
        area.innerHTML += adviceBox("⚠️ You crossed your budget! Next month try to fix spending limits early.");

    let highest = expenses.reduce((a,b)=>a.amount>b.amount?a:b);
    area.innerHTML += adviceBox(`📌 You spent most on <b>${highest.name}</b> — try reducing it next month!`);

    let remain = budget-total;
    if(remain > 0 && remain <= budget*0.2){
        area.innerHTML += adviceBox("🟡 You are close to your budget limit, spend carefully!");
    } else if(remain > budget*0.5){
        area.innerHTML += adviceBox("🟢 You saved more than 50% — great control! Keep it up 💪");
    }

    let avg = total / expenses.length;
    area.innerHTML += adviceBox(`📊 Your average spend per expense is ₹${Math.round(avg)} — track big spends to reduce it.`);
}

// --- SUGGESTION BOX UI ---
function adviceBox(msg){
    return `<div class="advice-box">${msg}</div>`;
}

showData();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
/* ---------- GLOBAL & BG (Analytics Style) ---------- */
body{
  margin:0;
  font-family: "Segoe UI", sans-serif;
  background: radial-gradient(circle at top,#4e74ff,#8c52ff,#4be1ec);
  background-size:300% 300%;
  animation:bgMove 10s infinite alternate ease-in-out;
  color:white;
  padding-top:60px;
}
@keyframes bgMove{
  0%{background-position:0% 50%;}
  100%{background-position:100% 50%;}
}

/* ---------- NAVBAR ---------- */
.navbar{
  width:100%;
  padding:14px 30px;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.4);
  position:sticky;top:0;z-index:10;
  display:flex;justify-content:space-between;align-items:center;
}
.logo{font-size:22px;font-weight:700;}

.navbar ul{display:flex;list-style:none;gap:15px;margin:0;padding:0;}
.navbar ul li a{
  text-decoration:none;color:white;
  padding:6px 12px;font-weight:500;border-radius:8px;
  transition:.3s;white-space:nowrap;
}
.navbar ul li a:hover,
.navbar ul li a.active{
  background:rgba(255,255,255,0.45);
  color:black;
}

/* ---------- MAIN CONTAINER (Analytics glass effect) ---------- */
.container{
    max-width:700px;width:90%;
    margin:40px auto;background:rgba(255,255,255,0.13);
    padding:30px;border-radius:20px;
    border:1px solid rgba(255,255,255,0.45);
    backdrop-filter:blur(10px);
    box-shadow:0 0 25px rgba(0,0,0,.25);
    animation:fadeIn 1.2s ease;
}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(40px);}
  to{opacity:1;transform:translateY(0);}
}

.container h2{
  text-align:center;
  text-shadow:0 0 12px rgba(255,255,255,.7);
}

/* ---------- INPUT + BUTTON ---------- */
input,button{
    padding:12px;border-radius:8px;border:none;
    font-size:16px;margin-bottom:12px;
}
input{
    width:80%;
    background:rgba(255,255,255,0.8);
}
button{
    background:white;color:black;font-weight:600;
    cursor:pointer;transition:.3s;
}
button:hover{transform:scale(1.05);background:#ffe59e;}

/* ---------- SUGGESTION BOX ---------- */
.advice-box{
    background:rgba(255,255,255,0.25);
    padding:12px;border-left:5px solid #ffe59e;
    border-radius:8px;margin-top:12px;
    font-size:17px;color:black;
}

/* ---------- TITLE TAG ---------- */
.suggestion-title{
    background:white;color:black;padding:8px 12px;
    display:inline-block;border-radius:6px;
    font-size:18px;margin-top:20px;font-weight:600;

<nav class="navbar">
    <h2 class="logo">💰Smart Expense Tracker</h2>
    <ul>
        <li><a href="smart_expensive_tracker.html">🏠Home</a></li>
        <li><a href="analytics.html">📊Analytics</a></li>
        <li><a class="active" href="#">🏷️Budget</a></li>
        <li><a href="about.html">ℹ️ About</a></li>
    </ul>
</nav>

<div class="container">
    <h2>Monthly Budget + Smart Advisor 🤖</h2>
</br>

    <input type="number" id="budgetInput" placeholder="Enter monthly budget ₹">
    <button onclick="setBudget()">Set / Update Budget</button>

    <h3>💰 Budget: ₹<span id="budget">0</span></h3>
    <h3>🧾 Total Expenses: ₹<span id="total">0</span></h3>
    <h3>💸 Remaining: ₹<span id="remain">0</span></h3>

    <div class="suggestion-title">Smart Spending Suggestions 👇</div>
    <div id="adviceArea"></div>
</div>

<script>
let budget = localStorage.getItem("budget") ? Number(localStorage.getItem("budget")) : 0;
let expenses = localStorage.getItem("expenses") ? JSON.parse(localStorage.getItem("expenses")) : [];

document.getElementById("budget").innerText = budget;

function setBudget(){
    let val = document.getElementById("budgetInput").value;
    if(!val || val<=0) return alert("Enter valid budget!");
    budget = Number(val);
    localStorage.setItem("budget", budget);
    showData();
}

function showData(){
    let total = expenses.reduce((s,e)=>s+e.amount,0);
    document.getElementById("budget").innerText = budget;
    document.getElementById("total").innerText = total;
    document.getElementById("remain").innerText = budget-total;
    giveAdvice(total);
}

function giveAdvice(total){
    let area = document.getElementById("adviceArea");
    area.innerHTML = "";

    if(expenses.length === 0){
        area.innerHTML = adviceBox("Start adding expenses to receive smart advice 😊");
        return;
    }

    if(total > budget){
        area.innerHTML += adviceBox("⚠️ You crossed your budget! Next month try to fix spending limits early.");
    }

    let highest = expenses.reduce((a,b)=>a.amount>b.amount?a:b);
    area.innerHTML += adviceBox(`📌 You spent most on <b>${highest.name}</b> — try reducing it next month!`);

    let remain = budget-total;
    if(remain > 0 && remain <= budget*0.2){
        area.innerHTML += adviceBox("🟡 You are close to your budget limit, spend carefully!");
    } else if(remain > budget*0.5){
        area.innerHTML += adviceBox("🟢 You saved more than 50% — great control! Keep it up 💪");
    }

    let avg = total / expenses.length;
    area.innerHTML += adviceBox(`📊 Your average spend per expense is ₹${Math.round(avg)} — track big spends to reduce it.`);
}

function adviceBox(msg){
    return `<div class="advice-box">${msg}</div>`;
}

showData();
</script>

</body>
</html>
